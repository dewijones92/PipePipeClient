# DewiPipe build gate. Real YouTube extraction can't run in CI (datacenter IP is bot-blocked), so
# this is a compile/assemble gate that protects the fork from build breakage as upstream + the
# ytdlp-kt SDK move. The app is a composite build (includeBuild ../PipePipeExtractor), so both
# forks are checked out as siblings.
name: Build (DewiPipe)

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publish step uploads the built APKs to the ytdlp-poc-v1 release

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout client
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: PipePipeClient

      - name: Checkout extractor (sibling for includeBuild ../PipePipeExtractor)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: dewijones92/PipePipeExtractor
          ref: main
          path: PipePipeExtractor

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Android SDK 37 (compileSdk 37 is a preview platform)
        run: |
          set -uo pipefail
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          # android-37 is a preview SDK -> not in the stable channel; try canary then stable.
          "$SM" --channel=3 "platforms;android-37" "build-tools;37.0.0" \
            || "$SM" "platforms;android-37" "build-tools;37.0.0" \
            || echo "::warning::could not install android-37 from sdkmanager (preview); assemble step will reveal if it's preinstalled"

      - name: Assemble debug APK
        working-directory: PipePipeClient
        run: ./gradlew :app:assembleDebug --console=plain

      # CD: on dev pushes, publish the built APKs to the rolling sideload release. Stable asset
      # names + --clobber keep exactly one arm64 + one x86_64 asset, always the latest dev build.
      # (Build needs no network, so this works despite CI's YouTube bot-block; on-device
      # verification stays a local step.)
      - name: Publish APKs to rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        working-directory: PipePipeClient
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          D=app/build/outputs/apk/debug
          cp "$D"/*-arm64-v8a-debug.apk DewiPipe-arm64-v8a.apk
          cp "$D"/*-x86_64-debug.apk    DewiPipe-x86_64.apk
          gh release upload ytdlp-poc-v1 DewiPipe-arm64-v8a.apk DewiPipe-x86_64.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
