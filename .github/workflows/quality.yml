name: Quality

# Code-quality gates: no committed dewidebug logging, and a DRY ratchet
# (PMD CPD duplication count must not grow past ci/cpd-baseline).
on:
  push:
    branches: [dev]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK (for PMD CPD)
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: 21

      - name: Run quality gates
        run: ./ci/quality-check.sh
