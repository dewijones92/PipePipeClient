// Git commit count as a ValueSource so it is correct under the configuration cache. A plain
// function runs at configuration time and its result is frozen into the config cache, so the
// version stopped tracking new commits (and could even go backwards) until the cache was
// invalidated. Declaring .git/logs/HEAD (the reflog, which changes on every commit/reset/
// checkout) as a file input makes Gradle re-evaluate obtain() whenever HEAD could have moved.
abstract class GitCommitCountValueSource
        implements ValueSource<Integer, GitCommitCountValueSource.Params> {
    interface Params extends ValueSourceParameters {
        org.gradle.api.file.RegularFileProperty getGitRefLog()
    }

    @javax.inject.Inject
    abstract org.gradle.process.ExecOperations getExecOperations()

    @Override
    Integer obtain() {
        try {
            def out = new ByteArrayOutputStream()
            getExecOperations().exec {
                it.commandLine 'git', 'rev-list', '--count', 'HEAD'
                it.standardOutput = out
                it.errorOutput = new ByteArrayOutputStream()
                it.ignoreExitValue = true
            }
            def text = out.toString().trim()
            return text.isEmpty() ? 0 : text.toInteger()
        } catch (Exception ignored) {
            // no git (e.g. source tarball build): fall back to the bare base version
            return 0
        }
    }
}
