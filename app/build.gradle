import org.gradle.api.provider.ValueSource
import org.gradle.api.provider.ValueSourceParameters

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.parcelize"
    id "org.jetbrains.kotlin.kapt"
}

def keyPath = System.getenv("KEY_PATH")
def keyStorePassword = System.getenv("KEY_STORE_PASSWORD")
def signingKeyAlias = System.getenv("KEY_ALIAS")
def signingKeyPassword = System.getenv("KEY_PASSWORD")

// Resolved once here (before the android {} block that consumes it). Backed by a ValueSource
// (defined at the bottom of this file) so it stays correct under the configuration cache.
def gitCommitCount = providers.of(GitCommitCountValueSource) {
    parameters {
        it.gitRefLog.set(layout.projectDirectory.file("../.git/logs/HEAD"))
    }
}.get()

android {
    compileSdk 37

    defaultConfig {
        applicationId "com.dewijones92.dewipipe"
        minSdk 23
        //noinspection OldTargetApi,ExpiredTargetSdkVersion
        targetSdk 35
        // DewiPipe versioning: derived from git so every commit (and so every CD-published APK)
        // carries a strictly increasing version — Android needs versionCode to grow for updates,
        // and Obtainium compares versions to detect them. Base = upstream PipePipe's versionCode
        // (1101 = 5.2.1-beta4); when an upstream merge bumps theirs, update the base and the
        // versionName prefix here (resolve the conflict favouring this scheme).
        // gitCommitCount is a ValueSource (see below) so it stays correct under Gradle's
        // configuration cache — a plain function froze the count at cache-populate time.
        versionCode 1101 * 10000 + gitCommitCount
        versionName "5.2.1-beta4-dewi." + gitCommitCount
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    splits {
        abi {
            reset()
            enable true
            include "armeabi-v7a", "arm64-v8a", "x86_64", "x86"
        }
    }

    signingConfigs {
        // Committed keystore so every debug build — local or CI — carries the SAME certificate.
        // Android (and therefore Obtainium) only installs an update whose signature matches the
        // installed app; CI's auto-generated per-run debug keystore broke release-to-release
        // updates (v4 and v5 shipped with different certs). Not a secret: debug-only identity.
        dewipipeDebug {
            storeFile rootProject.file("keystore/dewipipe-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (keyPath && keyStorePassword && signingKeyAlias && signingKeyPassword) {
            release {
                storeFile file(keyPath)
                storePassword keyStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            resValue "string", "app_name", "DewiPipe"
            signingConfig signingConfigs.dewipipeDebug
        }

        release {
            if (signingConfigs.findByName("release")) {
                signingConfig signingConfigs.release
            }
            if (System.properties.containsKey('packageSuffix')) {
                applicationIdSuffix System.getProperty('packageSuffix')
                resValue "string", "app_name", "DewiPipe " + System.getProperty('packageSuffix')
            } else {
                resValue "string", "app_name", "DewiPipe"
            }
            minifyEnabled true
            shrinkResources false // disabled to fix F-Droid's reproducible build
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_25
        targetCompatibility JavaVersion.VERSION_25
        encoding 'utf-8'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        compose true
        resValues true
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    namespace 'org.schabi.newpipe'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '25'
    }
}

kapt {
    correctErrorTypes true
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def abiCodes = project.ext.abiCodes
    def defaultVersionCode = android.defaultConfig.versionCode as int
    def defaultVersionName = android.defaultConfig.versionName

    variant.outputs.each { output ->
        def outputFileName = output.outputFileName.get()
        def abi = abiCodes.keySet().sort { -it.length() }.find { outputFileName.contains(it) }
        def versionCode = 100 * defaultVersionCode
        if (abi != null) {
            versionCode = (100 * defaultVersionCode) + abiCodes[abi]
        }
        output.versionCode.set(versionCode)
        output.outputFileName.set("PipePipe_${defaultVersionName}-${abi ?: 'universal'}-${variant.name}.apk")
    }
}

